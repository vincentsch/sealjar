name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      SEALJAR_REQUIRE_CHROME: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install Chrome
        run: |
          curl -fsSLo "$RUNNER_TEMP/google-chrome.deb" https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y "$RUNNER_TEMP/google-chrome.deb"
      - name: Check formatting and vet
        run: make lint
      - name: Test
        run: make test
      - name: Race test
        run: make race
      - name: Check command reference
        run: make docs-check
      - name: Check conformance
        run: make conformance
      - name: Check installer against local releases
        run: scripts/fake-release.sh python3 scripts/test-install.py
  platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Browser-using packages must not compete for native runner resources.
      GOFLAGS: -p=1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        run: make build
      - name: Warm up Chrome on native runner
        run: python3 scripts/ci-chrome-warmup.py
      - name: Test
        run: make test
