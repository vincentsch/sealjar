name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release-notes.py "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
      - name: Build release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: make build-all VERSION="$RELEASE_TAG"
      - name: Attest binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/signetleaf-*
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          assets=(
            dist/signetleaf-linux-amd64
            dist/signetleaf-linux-arm64
            dist/signetleaf-darwin-amd64
            dist/signetleaf-darwin-arm64
            dist/signetleaf-windows-amd64.exe
            dist/signetleaf-windows-arm64.exe
            dist/checksums.txt
          )
          (cd dist && sha256sum --check checksums.txt)
          gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag \
            --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
